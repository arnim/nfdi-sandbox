name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:fast

  ssh-smoke:
    name: Container and OpenSSH smoke
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NFDI_E2E_STATE_DIR: ${{ github.workspace }}/work/e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the SSH sandbox image
        run: docker build -f image/Dockerfile -t nfdi-sandbox:test .
      - name: Test Jupyter APIs, real OpenSSH, and SFTP
        timeout-minutes: 8
        run: npm run test:e2e:local
      - name: Clean up test resources
        if: always()
        timeout-minutes: 3
        run: npm run test:e2e:cleanup
